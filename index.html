function wordDoc(isi) { return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Paket Asesmen</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>@page{size:21cm 29.7cm;margin:2cm;} ${CSSDOK}</style></head><body>${isi}</body></html>`; }

function svgKePNG(svg) {
  return new Promise((res, rej) => {
    const w = 800, h = Math.round(w * rasioSVG(svg)), img = new Image();
    img.onload = () => { try { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); res(c.toDataURL("image/png").split(",")[1]); } catch (e) { rej(e); } };
    img.onerror = () => rej(new Error("Gambar gagal dirender."));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg", `<svg width="${w}" height="${h}"`));
  });
}
const b64Teks = t => btoa(unescape(encodeURIComponent(t))).replace(/.{1,76}/g, "$&\r\n");
async function ekspor(nama, buatIsi, W) {
  EXP = true; let isi; try { isi = buatIsi(); } finally { EXP = false; }
  const bagian = [];
  for (const q of sorted(W)) { if (q.gambar && isi.includes(`gambar_${q.no}.png`)) { try { bagian.push({ loc: `gambar_${q.no}.png`, b64: await svgKePNG(q.gambar) }); } catch (e) {} } }
  if (!bagian.length) { unduh(nama, ["\ufeff", wordDoc(isi)], "application/msword"); return; }
  const B = "----=_Part_SIEMHALIK", L = [];
  L.push("MIME-Version: 1.0", `Content-Type: multipart/related; boundary="${B}"; type="text/html"`, "", "--" + B, 'Content-Type: text/html; charset="utf-8"', "Content-Transfer-Encoding: base64", "Content-Location: file:///C:/paket.htm", "", b64Teks(wordDoc(isi)));
  bagian.forEach(p => L.push("--" + B, "Content-Type: image/png", "Content-Transfer-Encoding: base64", "Content-Location: " + p.loc, "", p.b64.replace(/.{1,76}/g, "$&\r\n")));
  L.push("--" + B + "--", "");
  unduh(nama, [L.join("\r\n")], "application/msword");
}

    } catch (e) { galat = pesanGalat(e); }
    S.sibuk = false; S.status = null; const kurang = rencana.length - W.soal.length;
    if (galat) S.pesan = { k: "err", t: galat + (W.soal.length ? " Soal yang sudah jadi tetap tersimpan; tekan \"Lanjutkan yang belum\"." : "") };
    else if (batal) S.pesan = { k: "warn", t: `Proses dihentikan. ${W.soal.length} dari ${rencana.length} soal sudah jadi.` };
    else if (kurang > 0) S.pesan = { k: "warn", t: `${kurang} soal belum berhasil dibuat. Tekan "Lanjutkan yang belum" untuk mencoba lagi.` };
    else { S.pesan = { k: "ok", t: `Selesai: ${W.soal.length} soal tersusun. Periksa setiap butir sebelum digunakan.` }; catat("buat_soal", `${JENIS[W.jenis].singkat} ${namaMapel(W)} Kelas ${W.kelas}`); }
    render();
  },
  async gambarAI(d) {
    if (S.sibuk || !(await siapAI())) return; const W = S.W, no = +d.no, q = W.soal.find(x => x.no === no); if (!q) return;
    S.sibuk = true; S.status = { teks: `Membuat gambar untuk soal nomor ${no}…`, frac: null }; S.pesan = null; render();
    try {
      let svg, ket = "";
      {
        const t = await panggilAI(`${konteks(W)}\n\nSoal nomor ${no}:\n${q.stimulus ? q.stimulus + "\n" : ""}${q.soal}\n${(q.opsi || []).map((o, i) => HURUF[i] + ". " + o).join("\n")}\n\nTUGAS: Buat satu gambar untuk soal ini agar soal menjadi bergambar. ${SPEC_SVG}\nKeluarkan JSON: {"gambar":"<svg ...>...</svg>","ketGambar":"keterangan satu kalimat"}`, "Anda ilustrator soal asesmen. Keluarkan hanya JSON yang sah tanpa teks lain.");
        const o = bacaJSON(t); svg = bersihSVG(o.gambar); ket = str(o.ketGambar);
      }
      if (!svg) throw new Error("Gambar dari AI tidak valid. Coba lagi.");
      q.gambar = svg; q.ketGambar = ket; S.pesan = { k: "ok", t: `Gambar soal nomor ${no} dibuat. Periksa kesesuaiannya dengan soal.` };
    } catch (e) { S.pesan = { k: "err", t: pesanGalat(e) }; }
    S.sibuk = false; S.status = null; render();
  },
  async ganti(d) {
    if (S.sibuk || !(await siapAI())) return; const W = S.W, no = +d.no, lama = W.soal.find(q => q.no === no); if (!lama) return;
    const slot = { ...(rancangSlot(W).find(s => s.no === no && s.bentuk === lama.bentuk) || { no, bentuk: lama.bentuk, level: lama.level || "MOTS", tp: lama.tp }), gambar: !!lama.gambar };
    S.sibuk = true; S.status = { teks: `Mengganti soal nomor ${no}…`, frac: null }; S.pesan = null; render();
    try { const h = await buatBatch({ ...W, soal: W.soal.filter(q => q.no !== no) }, [slot]); if (h.length) { W.soal = W.soal.map(q => q.no === no ? h[0] : q); S.pesan = { k: "ok", t: `Soal nomor ${no} sudah diganti.` }; } else S.pesan = { k: "warn", t: "Soal pengganti tidak berhasil dibuat. Coba lagi." }; }
    catch (e) { S.pesan = { k: "err", t: pesanGalat(e) }; }
    S.sibuk = false; S.status = null; render();
  },
  edit(d) {
    const q = S.W.soal.find(x => x.no === +d.no); if (!q) return;
    const f = { no: q.no, bentuk: q.bentuk, stimulus: q.stimulus, soal: q.soal, pembahasan: q.pembahasan, indikator: q.indikator, level: q.level, skor: q.skor, gambar: q.gambar || "", ketGambar: q.ketGambar || "", galat: "" };
    if (q.bentuk === "pg" || q.bentuk === "pgk") { f.opsi = q.opsi.join("\n"); f.kunci = kunciTeks(q); }
    else if (q.bentuk === "bs") f.pern = q.pernyataan.map(p => (p.benar ? "B|" : "S|") + p.teks).join("\n");
    else if (q.bentuk === "mj") { f.pas = q.kiri.map((k, i) => k + " | " + q.kanan[q.kunci[i]]).join("\n"); f.peng = q.kanan.filter((_, i) => !q.kunci.includes(i)).join("\n"); }
    else f.kunci = q.kunci;
    S.ed = f; S.modal = "edit"; render();
  },
  simpanEdit() {
    const f = S.ed, q = S.W.soal.find(x => x.no === f.no), g = t => { f.galat = t; render(); };
    const baris = v => String(v || "").split("\n").map(s => s.trim()).filter(Boolean);
    const n = { ...q, stimulus: f.stimulus.trim(), soal: f.soal.trim(), pembahasan: f.pembahasan.trim(), indikator: f.indikator.trim(), level: f.level, skor: Number(f.skor) || q.skor };
    if (!n.soal) return g("Pokok soal tidak boleh kosong.");
    if (String(f.gambar || "").trim()) { n.gambar = bersihSVG(f.gambar); if (!n.gambar) return g("Kode SVG tidak valid."); } else n.gambar = "";
    n.ketGambar = n.gambar ? String(f.ketGambar || "").trim() : "";
    if (q.bentuk === "pg" || q.bentuk === "pgk") {
      const o = baris(f.opsi); if (o.length < 3) return g("Minimal 3 pilihan jawaban.");
      const k = [...new Set(String(f.kunci).toUpperCase().split(/[^A-H]+/).filter(Boolean).map(h => HURUF.indexOf(h)))].sort((a, b) => a - b);
      if (!k.length || k.some(i => i < 0 || i >= o.length)) return g("Kunci harus berupa huruf pilihan yang tersedia.");
      if (q.bentuk === "pg" && k.length !== 1) return g("Pilihan ganda hanya punya satu kunci.");
      if (q.bentuk === "pgk" && (k.length < 2 || k.length >= o.length)) return g("PG kompleks perlu minimal dua kunci dan tidak boleh semua pilihan.");
      n.opsi = o; n.kunci = q.bentuk === "pg" ? k[0] : k;
    } else if (q.bentuk === "bs") {
      const p = baris(f.pern).map(s => { const m = s.match(/^([BS])\s*\|\s*(.+)$/i); return m ? { benar: m[1].toUpperCase() === "B", teks: m[2].trim() } : null; });
      if (p.length < 2 || p.some(x => !x)) return g("Setiap baris harus diawali B| atau S|.");
      n.pernyataan = p;
    } else if (q.bentuk === "mj") {
      const ps = baris(f.pas).map(s => s.split("|").map(x => x.trim()));
      if (ps.length < 2 || ps.some(x => x.length !== 2 || !x[0] || !x[1])) return g("Setiap baris berformat: pernyataan | jawaban.");
      const kanan = ps.map(x => x[1]).concat(baris(f.peng)), urut = acak(kanan.length);
      n.kiri = ps.map(x => x[0]); n.kanan = urut.map(i => kanan[i]); n.kunci = ps.map((_, i) => urut.indexOf(i));
    } else {
      n.kunci = String(f.kunci).trim(); if (!n.kunci) return g("Kunci tidak boleh kosong.");
      if (n.skor !== q.skor && q.rubrik) { const mx = q.rubrik.reduce((a, r) => a + r.skor, 0) || 1; n.rubrik = q.rubrik.map(r => ({ skor: Math.round(r.skor * n.skor / mx * 10) / 10, kriteria: r.kriteria })); }
    }
    S.W.soal = S.W.soal.map(x => x.no === f.no ? n : x); S.modal = null; S.pesan = { k: "ok", t: `Soal nomor ${f.no} diperbarui.` }; render();
  },
  /* proyek */
  baru: () => { S.W = newW(); S.W.sekolah = S.user.sekolah || ""; S.W.penyusun = S.user.nama || ""; S.pesan = null; S.view = "buat"; S.top = true; render(); },
  async simpanProyek() {
    const W = S.W; if (!W.soal.length) return;
    try {
      const rec = { id: W.id, owner: S.user.id, judul: `${JENIS[W.jenis].singkat} ${namaMapel(W)} Kelas ${W.kelas}`, jenis: W.jenis, mapel: namaMapel(W), kelas: W.kelas, jmlSoal: W.soal.length, updated: Date.now(), data: "" };
      W.id = await DB.saveProyek({ ...rec, data: JSON.stringify({ ...W, id: null }) }); // simpan dulu agar id terbentuk
      rec.id = W.id; await DB.saveProyek({ ...rec, data: JSON.stringify(W) });
      S.proyek = await DB.listProyek(S.user.id); S.pesan = { k: "ok", t: "Proyek tersimpan di Bank Proyek." }; catat("simpan_proyek", rec.judul);
    } catch (e) { S.pesan = { k: "err", t: pesanGalat(e) }; }
    render();
  },
  bukaProyek(d) {
    const p = S.proyek.find(x => x.id === d.id); if (!p) return;
    try { const d0 = JSON.parse(p.data); S.W = Object.assign(newW(), d0, { id: p.id }); S.W.jumlah = { ...newW().jumlah, ...(d0.jumlah || {}) }; S.W.skor = { ...SKOR0, ...(d0.skor || {}) }; S.W.dist = { ...newW().dist, ...(d0.dist || {}) }; S.W.step = S.W.soal.length ? 4 : 3; S.pesan = null; S.view = "buat"; S.top = true; render(); } catch (e) { toast("Data proyek tidak dapat dibaca.", "err"); }
  },
  konfHapusProyek: d => { S.konf = { teks: "Hapus proyek ini secara permanen?", act: "hapusProyek", arg: d }; S.modal = "konfirm"; render(); },
  async hapusProyek(d) { try { await DB.delProyek(d.id); S.proyek = S.proyek.filter(p => p.id !== d.id); toast("Proyek dihapus."); } catch (e) { toast(pesanGalat(e), "err"); } render(); },
  /* ekspor */
  async wordTab() { const W = S.W, t = W.tab; if (t === "soal") return; try { await ekspor(nmBerkas(DOK[t][0]), () => DOK[t][1](W), W); catat("ekspor", DOK[t][0]); } catch (e) { toast(pesanGalat(e), "err"); } },
  async wordAll() { const W = S.W; try { await ekspor(nmBerkas("Paket"), () => ["kisi", "naskah", "kunci"].map((k, i) => `<div class="${i ? "pb" : ""}">${DOK[k][1](W)}</div>`).join(""), W); catat("ekspor", "Paket lengkap"); } catch (e) { toast(pesanGalat(e), "err"); } },
  cetak() {
    const W = S.W, t = W.tab; if (t === "soal") return;
    const w = window.open("", "_blank"); if (!w) return toast("Jendela cetak diblokir. Gunakan Ekspor Word lalu cetak dari Word.", "warn");
    w.document.write(`<html><head><meta charset="utf-8"><title>${esc(DOK[t][0])}</title><style>@page{margin:1.8cm;} ${CSSDOK}</style></head><body>${DOK[t][1](W)}</body></html>`); w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
  },
  /* admin */
  muatAdmin: () => muatAdmin(),
  tambahGuru: () => { S.gf = { mode: "baru", id: "", nama: "", username: "", password: "", sekolah: "", galat: "" }; S.modal = "guru"; render(); },
  editGuru(d) { const u = S.users.find(x => x.id === d.id); if (!u) return; S.gf = { mode: "edit", id: u.id, nama: u.nama, username: u.username, password: "", sekolah: u.sekolah || "", galat: "" }; S.modal = "guru"; render(); },
  async simpanGuru() {
    const g = S.gf, er = t => { g.galat = t; render(); }; const nama = g.nama.trim(), un = g.username.trim().toLowerCase();
    if (!nama) return er("Nama wajib diisi.");
    if (g.mode === "baru") {
      if (!/^[a-z0-9._-]{3,30}$/.test(un)) return er("Username 3–30 karakter: huruf kecil, angka, titik, strip, garis bawah.");
      if (g.password.length < 6) return er("Kata sandi minimal 6 karakter.");
    } else if (g.password && g.password.length < 6) return er("Kata sandi minimal 6 karakter.");
    try {
      if (g.mode === "baru") {
        if (await DB.getUser(un)) return er("Username sudah dipakai.");
        await DB.saveUser({ id: un, nama, username: un, passHash: await sha(un, g.password), sekolah: g.sekolah.trim(), aktif: true, dibuat: Date.now() });
      } else {
        const u = S.users.find(x => x.id === g.id); await DB.saveUser({ ...u, nama, sekolah: g.sekolah.trim(), passHash: g.password ? await sha(u.id, g.password) : u.passHash });
      }
      S.users = await DB.listUsers(); S.modal = null; toast("Data guru tersimpan.");
    } catch (e) { return er(pesanGalat(e)); }
    render();
  },
  async toggleGuru(d) { const u = S.users.find(x => x.id === d.id); try { await DB.saveUser({ ...u, aktif: u.aktif === false }); S.users = await DB.listUsers(); } catch (e) { toast(pesanGalat(e), "err"); } render(); },
  konfHapusGuru: d => { S.konf = { teks: "Hapus akun guru ini? Proyek milik guru tidak ikut terhapus.", act: "hapusGuru", arg: d }; S.modal = "konfirm"; render(); },
  async hapusGuru(d) { try { await DB.delUser(d.id); S.users = await DB.listUsers(); toast("Akun guru dihapus."); } catch (e) { toast(pesanGalat(e), "err"); } render(); }
};
const nmBerkas = t => `${JENIS[S.W.jenis].singkat}_${namaMapel(S.W)}_Kelas_${S.W.kelas}_${t}`.replace(/[^A-Za-z0-9]+/g, "_") + ".doc";

/* ============ EVENT ============ */
const app = $("#app");
app.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const f = H[b.dataset.act]; if (f) f({ ...b.dataset }); });
const baca = t => (t.type === "number" || t.dataset.n) ? Number(t.value) : t.value;
app.addEventListener("input", e => { const t = e.target; if (t.dataset.k) setPath(t.dataset.k, baca(t)); if (t.dataset.inp && H[t.dataset.inp]) H[t.dataset.inp](); });
app.addEventListener("change", e => { const t = e.target; if (t.dataset.k) setPath(t.dataset.k, baca(t)); if (t.dataset.chg && H[t.dataset.chg]) H[t.dataset.chg](t.value); });
app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.enter && H[e.target.dataset.enter]) { e.preventDefault(); H[e.target.dataset.enter](); } });

/* ============ BOOT ============ */
// Penyegaran otomatis data admin (aman untuk banyak pengguna bersamaan)
setInterval(() => { if (S.user && S.role === "admin" && !S.modal && !S.sibuk && !document.hidden && ["dash", "riwayat", "guru"].includes(S.view)) muatAdmin(); }, 60000);
(async function boot() {
  render();
  if (IS_PREVIEW) { await seedPreview(); S.ready = true; render(); return; }
  try {
    if (firebaseConfig.apiKey === "API_KEY_ANDA") throw new Error("firebaseConfig belum diisi. Lihat petunjuk penggunaan.");
    await initFirebase();
    await new Promise(res => { const un = fb.Au.onAuthStateChanged(fb.auth, async u => { un(); try { if (u) await setSession({ id: u.uid, nama: "Administrator", email: u.email }, "admin"); } catch (e) {} res(); }); });
  } catch (e) { S.fatal = pesanGalat(e); }
  S.ready = true; render();
})();
</script>
</body>
</html>
